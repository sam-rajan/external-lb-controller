namespace: external-lb-controller-system

# Keep namePrefix in sync with the namespace prefix.
namePrefix: external-lb-controller-


resources:
- ../rbac
- ../manager
- ../webhook
# [CERTMANAGER] Issues the webhook serving certificate. Requires cert-manager in the cluster.
- ../certmanager
# Optional: Prometheus ServiceMonitor.
#- ../prometheus
- metrics_service.yaml
# Optional: NetworkPolicy for the metrics and webhook endpoints.
#- ../network-policy

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# Optional: serve metrics with cert-manager certificates.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

- path: manager_webhook_patch.yaml
  target:
    kind: Deployment

# [CERTMANAGER] Fill in the Certificate's DNS names from the webhook Service and
# point the webhook's CA injection annotation at the Certificate.
replacements:
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.name
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 0
      create: true
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.namespace
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
    fieldPaths:
    - .spec.dnsNames.0
    - .spec.dnsNames.1
    options:
      delimiter: '.'
      index: 1
      create: true
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
    fieldPath: .metadata.namespace
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - .metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 0
      create: true
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
    fieldPath: .metadata.name
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - .metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: '/'
      index: 1
      create: true
