# controller-gen has no matchConditions marker, so this patch scopes the webhook to Services using our class.
# The has() guard is required: reading an absent spec.loadBalancerClass is a CEL error, which
# failurePolicy: Fail treats as a rejection.
- op: add
  path: /webhooks/0/matchConditions
  value:
  - name: only-external-lb-class
    expression: "has(object.spec.loadBalancerClass) && object.spec.loadBalancerClass == 'external-lb.io/lb'"
