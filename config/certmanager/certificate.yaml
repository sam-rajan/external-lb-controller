# A self-signed Issuer and the Certificate that cert-manager turns into the
# webhook-server-cert Secret mounted by the manager (see
# config/default/manager_webhook_patch.yaml). The dnsNames and the
# cert-manager.io/inject-ca-from annotation on the webhook configuration are
# filled in by the replacements in config/default/kustomization.yaml.
# More information: https://cert-manager.io/docs/
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/name: external-lb-controller
    app.kubernetes.io/managed-by: kustomize
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/name: external-lb-controller
    app.kubernetes.io/managed-by: kustomize
  name: serving-cert
  namespace: system
spec:
  # SERVICE_NAME and SERVICE_NAMESPACE are substituted by kustomize.
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
