apiVersion: v1
kind: Service
metadata:
  name: out-tree-lb-controller-webhook-service
  namespace: default
spec:
  ports:
  - port: 443
    protocol: TCP
  # No selector: traffic is routed via the EndpointSlice below instead of
  # to an in-cluster pod.
---
# EndpointSlices link to a Service via the kubernetes.io/service-name label,
# not by matching metadata.name (v1 Endpoints is deprecated as of k8s 1.33).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: out-tree-lb-controller-webhook-service
  namespace: default
  labels:
    kubernetes.io/service-name: out-tree-lb-controller-webhook-service
addressType: IPv4
ports:
- protocol: TCP
  port: 9443
endpoints:
- addresses:
  - 172.20.0.1
