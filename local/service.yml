apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
  labels:
    app: web-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-0123456789abcdef0"
    # service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0123456789abcdef0,subnet-0fedcba9876543210
    service.beta.kubernetes.io/aws-load-balancer-name: "my-custom-named-lb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:111122223333:certificate/00000000-0000-0000-0000-000000000000"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  loadBalancerClass: otlbc.io/lb
  selector:
    run: nginx
  ports:
    - name: http
      protocol: TCP
      port: 443 # The port the Service is exposed on inside the cluster
      targetPort: 8080 # The port the application is actually listening on in the Pod