apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
  labels:
    app: web-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0123456789abcdef0,subnet-0fedcba9876543210
spec:
  type: LoadBalancer
  loadBalancerClass: samrajan.me/otlbc
  selector:
    run: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80 # The port the Service is exposed on inside the cluster
      targetPort: 8080 # The port the application is actually listening on in the Pod