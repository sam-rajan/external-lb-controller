name: Release

# Publishes a multi-arch image to GHCR and install.yaml to a GitHub Release on v* tags.
# Stable tags also move "latest"; pre-releases (v0.1.0-rc1) do not.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push multi-arch image
        run: make docker-buildx IMG="${IMAGE,,}:${TAG}"

      - name: Tag image as latest (stable releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: docker buildx imagetools create --tag "${IMAGE,,}:latest" "${IMAGE,,}:${TAG}"

      - name: Build install bundle
        run: make build-installer IMG="${IMAGE,,}:${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$TAG" dist/install.yaml --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${flags[@]}"
